[project]
name = "checkout"
version = "1.0.0"
description = "订单结算服务示例业务工程(带测试,用于 SDD 上下文管理系统的验证样例)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/checkout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
