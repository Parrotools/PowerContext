[project]
name = "sddctx"
version = "1.0.0"
description = "规有所依——面向软件持续演进的 SDD 上下文管理系统(MiniMax × OceanBase 赛题)"
requires-python = ">=3.11"
dependencies = [
    "pylibseekdb>=1.4.0,<2",
    "pyobvector>=0.2.0",
    "sqlalchemy>=2.0,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "powercontext[cli,server]==1.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sddctx = "sddctx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sddctx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
