version: "3.8"

services:
  powercontext:
    build:
      context: .
      dockerfile: Dockerfile.powercontext
    container_name: zhixu-powercontext
    ports:
      - "8010:8010"
    environment:
      # Data directory (SQLite database stored here)
      POWERCONTEXT_HOME: /data
      # HTTP binding — bind to all interfaces for Docker network access
      POWERCONTEXT_SERVER_HTTP_HOST: 0.0.0.0
      POWERCONTEXT_SERVER_HTTP_PORT: 8010
      # Allow non-localhost access without TLS (Docker internal network)
      POWERCONTEXT_SERVER_ALLOW_INSECURE_HTTP: "true"
      POWERCONTEXT_SERVER_ALLOW_UNAUTHENTICATED_NON_LOOPBACK: "true"
      # Access control: disabled (open access for demo)
      POWERCONTEXT_SERVER_ACCESS_MODE: disabled
      # Workspace
      POWERCONTEXT_SERVER_WORKSPACE: /workspace
      # Runtime: SQLite requires artifact_processing_role=all
      POWERCONTEXT_SERVER_RUNTIME_ARTIFACT_PROCESSING_ROLE: all
    volumes:
      - powercontext-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zhixu-backend
    ports:
      - "8000:8000"
    environment:
      SEEKDB_DATABASE_PATH: /app/data
      POWERCONTEXT_URL: http://powercontext:8010
      POWERCONTEXT_SCOPE_ID: zhixu-default
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","*.qoder.site"]'
    volumes:
      - backend-data:/app/data
    depends_on:
      powercontext:
        condition: service_healthy

volumes:
  powercontext-data:
  backend-data:
